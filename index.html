<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Schattenpfad — 2D-Silhouetten-Kampfspiel. Kämpfe dich über den Pfad bis zu deinem eigenen Schatten.">
  <meta name="theme-color" content="#0e0a14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta property="og:title" content="Schattenpfad">
  <meta property="og:description" content="2D-Silhouetten-Kampfspiel im Browser — am besten am Handy im Querformat.">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Schattenpfad</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0e0a14;
      color: #cbb8d9;
      font-family: system-ui, sans-serif;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    canvas {
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      border-radius: 6px;
      /* Passt sich dem Bildschirm an, behält aber das 16:9-Format.
         dvh = sichtbare Höhe OHNE Browser-Leisten (wichtig am Handy). */
      width: min(100vw, calc(100vh * 16 / 9), 960px);
      width: min(100vw, calc(100dvh * 16 / 9), 960px);
      height: auto;
      touch-action: none;
    }
    p { font-size: 14px; opacity: 0.8; padding: 0 12px; text-align: center; }

    /* Hinweis-Overlay: erscheint nur am Handy im Hochformat */
    #drehhinweis {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(8, 6, 16, 0.92);
      z-index: 10;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      text-align: center;
      padding: 24px;
      pointer-events: none; /* Tipps gehen durch — so kann Android direkt ins Vollbild */
    }
    #drehhinweis .symbol { font-size: 64px; animation: drehen 1.6s ease-in-out infinite; }
    #drehhinweis .text { font-size: 20px; color: #f3e9f7; max-width: 300px; }
    @keyframes drehen {
      0%, 25% { transform: rotate(0deg); }
      60%, 100% { transform: rotate(90deg); }
    }
    @media (hover: none) and (pointer: coarse) {
      p { display: none; } /* Tastatur-Hinweise am Handy ausblenden */
      @media (orientation: portrait) {
        #drehhinweis { display: flex; }
      }
    }
  </style>
</head>
<body>
  <canvas id="spiel" width="960" height="540"></canvas>
  <p>← → laufen &nbsp;·&nbsp; ↑ springen (↑ schräg = Salto) &nbsp;·&nbsp; ↓ ducken (↓ schräg = Rolle) &nbsp;·&nbsp; A Schlag &nbsp;·&nbsp; S Tritt &nbsp;·&nbsp; D blocken &nbsp;·&nbsp; W Spezial &nbsp;·&nbsp; R Revanche &nbsp;·&nbsp; Esc Menü</p>
  <div id="drehhinweis">
    <div class="symbol">📱</div>
    <div class="text">Dreh dein Handy ins Querformat, um zu kämpfen</div>
  </div>
  <script type="module" src="src/main.js"></script>
  <script>
    // PWA: Service Worker macht das Spiel installierbar und offline spielbar
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {
        /* z. B. file:// oder alte Browser — Spiel läuft trotzdem */
      });
    }
  </script>
</body>
</html>
